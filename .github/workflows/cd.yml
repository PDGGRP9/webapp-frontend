name: CD

on:
  push:
    tags: ['*.*.*']

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate static site contract
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')
          required = [
              'loginView',
              'appShell',
              'dashboardView',
              'statsView',
              'app.js',
              'styles.css',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f'Missing required markers: {missing}')
          PY

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/webapp-frontend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run container
        run: |
          docker build -t webapp-frontend-smoke .
          docker run -d --name webapp-frontend-smoke -p 8080:80 webapp-frontend-smoke

      - name: Wait for frontend to be ready
        run: |
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:8080/ && break
            echo "frontend not ready yet, retrying..."
            sleep 2
          done

      - name: Check frontend
        run: curl -sf http://127.0.0.1:8080/

      - name: Show logs on failure
        if: failure()
        run: docker logs webapp-frontend-smoke

      - name: Tear down
        if: always()
        run: docker rm -f webapp-frontend-smoke

  deploy:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Deployment placeholder
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REF='${{ github.ref_name }}'
          SHA='${{ github.sha }}'

          echo "CD succeeded on tag ${REF} (commit ${SHA})."
          echo "Images published:"
          echo "  ghcr.io/${OWNER}/webapp-frontend:${REF}"
          echo "  ghcr.io/${OWNER}/webapp-frontend:${SHA}"
          echo ""
          echo "No deployment target is configured yet."
          echo "To deploy for real, on the target server run:"
          echo "  docker compose pull && docker compose up -d"